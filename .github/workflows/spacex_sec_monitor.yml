name: SpaceX SEC Filing Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email for the most recent filing (does not update state)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # needed to commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check for new SpaceX filings
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ "${{ github.event.inputs.test_email }}" = "true" ]; then
            python check.py --test-email
          else
            python check.py
          fi

      - name: Commit updated state
        run: |
          git config user.name "spacex-sec-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update filing state"
          git push
